<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניהול ערבויות</title>
<style>
  :root{
    --brand:#0070f2; --link:#0064d9; --ink:#131e29; --muted:#556b82;
    --page:#f5f6f7; --line:#e5e5e5; --head-line:#a8b2bd; --field:#556b81;
    --sel:#e1f4ff; --shadow0:0 0 .125rem 0 rgba(34,53,72,.2),0 .125rem .25rem 0 rgba(34,53,72,.2);
    --shadow2:0 .625rem 1.875rem 0 rgba(34,53,72,.15),0 0 .125rem 0 rgba(34,53,72,.2);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:"72","72full",Arial,Helvetica,sans-serif;font-size:14px;line-height:1.4}
  .wrap{max-width:1600px;margin:0 auto;padding:16px 24px;display:flex;flex-direction:column;gap:40px}
  .card{background:#fff;border-radius:12px;box-shadow:var(--shadow0);padding:8px 24px 16px;display:flex;flex-direction:column;gap:8px}
  .card-head{display:flex;align-items:center;justify-content:space-between;min-height:26px}
  h2{margin:0;font-size:16px;font-weight:700}
  .table-box{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{padding:6px 8px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--head-line);text-align:right;white-space:nowrap}
  tbody td{padding:4px 8px;border-bottom:1px solid var(--line)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#f7f9fb}
  tbody tr.sel{background:var(--sel)}
  tbody tr.sel td:first-child{box-shadow:inset -3px 0 0 var(--link)}
  tfoot th,tfoot td{padding:4px 8px;border-top:2px solid var(--ink);font-weight:700}
  .num{direction:ltr;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
  .date{direction:ltr;text-align:right;white-space:nowrap}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .fi{height:26px;padding:0 8px;border:1px solid var(--field);border-radius:4px;background:#fff;color:var(--ink);font:inherit;font-size:14px;width:100%}
  .fi:hover,.fi:focus{border-color:var(--link)}
  :focus-visible{outline:2px solid #0032a5;outline-offset:1px}
  .ro{height:26px;padding:0 8px;display:flex;align-items:center;border-radius:4px;background:var(--page);flex:1;min-width:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:26px;padding:0 10px;border:1px solid #bcc3ca;border-radius:8px;background:#fff;color:var(--link);font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn:hover{background:#eaecee}
  .btn-lg{height:36px;min-width:88px;padding:0 16px}
  .btn-em{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-em:hover{background:var(--link)}
  .icon-btn{width:28px;height:26px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:none;border-radius:8px;background:transparent;cursor:pointer}
  .icon-btn:hover{background:#eaecee}
  .no-btn{padding:0;border:none;background:transparent;color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;cursor:pointer}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:48px;row-gap:10px}
  .fr{display:flex;align-items:center;gap:12px;min-height:26px}
  .fr>.fl{width:130px;flex:none;font-size:13px;color:var(--muted)}
  .fr>.fi{flex:1;min-width:0}
  .overlay{position:fixed;inset:0;background:rgba(34,53,72,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .dialog{width:1000px;max-width:100%;max-height:100%;background:#fff;border-radius:12px;box-shadow:var(--shadow2);display:flex;flex-direction:column;overflow:hidden}
  .dlg-head{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 16px;border-bottom:1px solid #d9d9d9;flex:none}
  .dlg-head h3{margin:0;font-size:16px;font-weight:700}
  .dlg-scroll{overflow-y:auto}
  .dlg-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:48px;padding:16px 24px 8px}
  .dlg-col{display:flex;flex-direction:column;gap:6px}
  .dlg-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;height:56px;padding:0 16px;border-top:1px solid #d9d9d9;flex:none}
  .gt th{font-size:13px}
  .gt td{padding:3px 4px;cursor:default}
  .gt tr{cursor:default}
  .gt tr:hover{background:none}
  @media (max-width:900px){.grid3{grid-template-columns:minmax(0,1fr)}.dlg-body{grid-template-columns:minmax(0,1fr)}}
  @media (max-width:720px){.wrap{padding:12px 16px}.card{padding:8px 12px 12px}}
</style>
</head>
<body>
<main id="app" class="wrap"></main>

<script>
(function () {
  "use strict";

  var CURRENCIES = ["שקל חדש", "דולר", "אירו"];
  var TYPES = ["ערבות חוק מכר", "ערבות בנקאית", "ערבות ביצוע", "פוליסת ביטוח"];
  var STATUSES = ["בבקשה", "פעילה", "הוחזרה", "בוטלה"];
  var INDEXES = [["", "ללא"], ["מדד תשומות הבנייה", "מדד תשומות הבנייה"], ["מדד המחירים לצרכן", "מדד המחירים לצרכן"]];
  var BANKS = ["המזרחי", "לאומי", "הפועלים", "דיסקונט", "הבינלאומי"];
  var LAWYERS = [["", 'בחר עו"ד'], ["משה כהן", "משה כהן"], ["ניר דויוי", "ניר דויוי"], ["יצחק לוי", "יצחק לוי"]];

  var seq = 100;
  function base(o) {
    return Object.assign({ id: ++seq, no: "", amount: 0, currency: "שקל חדש", assigned: false, start: "", type: "ערבות חוק מכר", status: "בבקשה", requested: "", returned: "", deposited: "", depositReturned: "", cancelled: "", end: "", index: "", baseDate: "", baseValue: "", bank: "המזרחי", branch: "", account: "", fee: "", lawyer: "", notes: "" }, o || {});
  }
  var state = {
    rows: [
      base({ no: "1001", amount: 80952, start: "04/12/2018", status: "הוחזרה", requested: "20/11/2018", returned: "31/07/2025", deposited: "04/12/2018", depositReturned: "31/07/2025", end: "31/07/2025", index: "מדד תשומות הבנייה", baseDate: "10/2018", baseValue: "149.7636", branch: "432", account: "[חשבון]", fee: "0.80%", lawyer: "משה כהן", notes: "ערבות לתשלום 1" }),
      base({ no: "1002", amount: 92516, start: "25/07/2021", status: "פעילה", requested: "15/07/2021", deposited: "29/07/2021", index: "מדד תשומות הבנייה", baseDate: "10/2018", baseValue: "149.7636", branch: "432", account: "[חשבון]", fee: "0.80%", lawyer: "ניר דויוי", notes: "ערבות לתשלום 2" }),
      base({ no: "1003", amount: 874750, start: "31/07/2025", status: "פעילה", requested: "20/07/2025", deposited: "31/07/2025", index: "מדד תשומות הבנייה", baseDate: "10/2018", baseValue: "149.7636", branch: "432", account: "[חשבון]", fee: "0.80%", lawyer: "יצחק לוי", notes: "ערבות לתשלום 3" })
    ],
    selId: null,
    dlg: null
  };
  state.selId = state.rows[0].id;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(n) { return Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function find(id) { return state.rows.filter(function (r) { return r.id === id; })[0] || null; }
  function opts(list, cur) {
    return list.map(function (o) { var v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o; return '<option value="' + esc(v) + '"' + (v === cur ? " selected" : "") + '>' + esc(t) + '</option>'; }).join("");
  }
  var ICON = {
    plus: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>',
    trash: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.8 6.5v4.5M9.2 6.5v4.5"/></svg>',
    close: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
    print: '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4.5 5.5v-4h7v4M4.5 11.5h-2v-6h11v6h-2M4.5 9.5h7v5h-7z"/></svg>'
  };
  function rowSelect(id, name, list, cur, label) {
    return '<label class="sr" for="' + name + '-' + id + '">' + label + '</label><select class="fi" id="' + name + '-' + id + '" data-row="' + id + '" data-k="' + name + '">' + opts(list, cur) + '</select>';
  }

  // ---------- list ----------
  function listCard() {
    var total = 0;
    var body = state.rows.map(function (g) {
      total += Number(g.amount || 0);
      var sel = g.id === state.selId;
      return '<tr class="' + (sel ? "sel" : "") + '" data-select="' + g.id + '">' +
        '<td><button type="button" class="no-btn" data-select="' + g.id + '" aria-pressed="' + sel + '" aria-label="הצג פרטי ערבות ' + esc(g.no) + '">' + esc(g.no) + '</button></td>' +
        '<td class="num">' + fmt(g.amount) + '</td>' +
        '<td style="width:110px">' + rowSelect(g.id, "currency", CURRENCIES, g.currency, "מטבע") + '</td>' +
        '<td style="text-align:center"><label class="sr" for="assigned-' + g.id + '">מוסב</label><input type="checkbox" id="assigned-' + g.id + '" data-row="' + g.id + '" data-k="assigned"' + (g.assigned ? " checked" : "") + ' style="width:16px;height:16px;margin:0;accent-color:#0064d9"></td>' +
        '<td class="date">' + esc(g.start) + '</td>' +
        '<td style="width:150px">' + rowSelect(g.id, "type", TYPES, g.type, "סוג") + '</td>' +
        '<td style="width:116px">' + rowSelect(g.id, "status", STATUSES, g.status, "סטטוס") + '</td>' +
        '<td class="date">' + esc(g.requested) + '</td>' +
        '<td class="date">' + esc(g.returned) + '</td>' +
        '<td class="date">' + esc(g.deposited) + '</td>' +
        '<td class="date">' + esc(g.depositReturned) + '</td>' +
        '<td class="date">' + esc(g.cancelled) + '</td>' +
        '<td class="date">' + esc(g.end) + '</td>' +
        '<td><div style="display:flex;justify-content:center;gap:4px">' +
        '<button type="button" class="icon-btn" style="color:#0064d9" aria-label="הוסף שורה מתחת" title="הוסף שורה" data-act="insert" data-id="' + g.id + '">' + ICON.plus + '</button>' +
        '<button type="button" class="icon-btn" style="color:#aa0808" aria-label="מחק שורה" title="מחק שורה" data-act="remove" data-id="' + g.id + '">' + ICON.trash + '</button></div></td></tr>';
    }).join("");
    return '<section class="card" aria-labelledby="g-title"><div class="card-head"><h2 id="g-title">ניהול ערבויות (' + state.rows.length + ')</h2>' +
      '<button type="button" class="btn" data-act="append">' + ICON.plus + 'הוסף ערבות</button></div>' +
      '<div class="table-box"><table><thead><tr>' +
      '<th>מספר</th><th class="num">סכום</th><th>מטבע</th><th style="text-align:center">מוסב</th><th>תאריך התחלה</th><th>סוג</th><th>סטטוס</th>' +
      '<th>תאריך בקשה</th><th>תאריך החזרה</th><th>תאריך הפקדת ערבות</th><th>תאריך החזרת הפקדה</th><th>תאריך ביטול</th><th>תאריך סיום</th><th style="width:88px;text-align:center">פעולות</th>' +
      '</tr></thead><tbody>' + body + '</tbody>' +
      '<tfoot><tr><th scope="row" style="text-align:right">סה"כ</th><td class="num">' + fmt(total) + '</td><td colspan="12"></td></tr></tfoot></table></div></section>';
  }

  // ---------- details ----------
  function detailsCard() {
    var s = find(state.selId);
    var head = '<section class="card" aria-labelledby="d-title" style="gap:12px"><div class="card-head"><h2 id="d-title">פרטי ערבות ' + (s ? esc(s.no) : "") + '</h2></div>';
    if (!s) return head + '<p class="sr-none" style="margin:0;color:#556b82">בחר ערבות ברשימה כדי להציג את פרטיה</p></section>';
    function inp(id, label, k, extra) { return '<div class="fr"><label class="fl" for="' + id + '">' + label + '</label><input id="' + id + '" class="fi" type="text" value="' + esc(s[k]) + '" data-sel="' + k + '" ' + (extra || "") + '></div>'; }
    function sel(id, label, k, list) { return '<div class="fr"><label class="fl" for="' + id + '">' + label + '</label><select id="' + id + '" class="fi" data-sel="' + k + '">' + opts(list, s[k]) + '</select></div>'; }
    return head + '<div class="grid3">' +
      sel("d-idx", "מדד", "index", INDEXES) +
      sel("d-bank", "בנק", "bank", BANKS) +
      inp("d-fee", "אחוז עמלה שנתי", "fee", 'inputmode="decimal" style="direction:ltr;text-align:left"') +
      inp("d-bdate", "תאריך בסיס", "baseDate", 'placeholder="mm/yyyy" style="direction:ltr;text-align:right"') +
      inp("d-branch", "סניף", "branch", 'inputmode="numeric"') +
      sel("d-law", 'עו"ד', "lawyer", LAWYERS) +
      inp("d-bval", "ערך בסיס", "baseValue", 'inputmode="decimal" style="direction:ltr;text-align:left"') +
      inp("d-acc", "חשבון", "account", 'inputmode="numeric"') +
      inp("d-notes", "הערות", "notes") +
      '</div></section>';
  }

  // ---------- dialog ----------
  function newGu() { return { id: ++seq, name: "", idNo: "", address: "", house: "", area: "", zip: "", notes: "" }; }
  function freshDlg(at) { return Object.assign(base(), { at: at, received: "", feePct: "", feeAmount: "", guarantors: [newGu()] }); }
  function dialog() {
    var d = state.dlg; if (!d) return "";
    function ro(label, val, ltr) { return '<div class="fr"><span class="fl">' + label + '</span><div class="ro"' + (ltr ? ' style="direction:ltr;justify-content:flex-end"' : "") + '>' + val + '</div></div>'; }
    function inp(id, label, k, extra) { return '<div class="fr"><label class="fl" for="' + id + '">' + label + '</label><input id="' + id + '" class="fi" type="text" value="' + esc(d[k]) + '" data-dlg="' + k + '" ' + (extra || "") + '></div>'; }
    function dt(id, label, k) { return inp(id, label, k, 'placeholder="dd/mm/yyyy" style="direction:ltr;text-align:right"'); }
    function sel(id, label, k, list) { return '<div class="fr"><label class="fl" for="' + id + '">' + label + '</label><select id="' + id + '" class="fi" data-dlg="' + k + '">' + opts(list, d[k]) + '</select></div>'; }
    var gu = d.guarantors.map(function (r) {
      function c(k, label, extra) { return '<td><input class="fi" type="text" aria-label="' + label + '" value="' + esc(r[k]) + '" data-gu="' + r.id + '" data-k="' + k + '" ' + (extra || "") + '></td>'; }
      return '<tr>' + c("name", "שם ערב") + c("idNo", "ת.ז.", 'inputmode="numeric" style="direction:ltr;text-align:right"') + c("address", "כתובת") + c("house", "מספר בית") + c("area", "אזור") + c("zip", "מיקוד", 'inputmode="numeric" style="direction:ltr;text-align:right"') + c("notes", "הערות ערב") +
        '<td style="text-align:center"><button type="button" class="icon-btn" style="color:#aa0808" aria-label="מחק ערב" data-act="gu-remove" data-id="' + r.id + '">' + ICON.trash + '</button></td></tr>';
    }).join("");
    return '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="gd-title">' +
      '<div class="dlg-head"><h3 id="gd-title">ערבות</h3><button type="button" class="icon-btn" style="width:32px;height:32px;color:#556b82" aria-label="סגור" data-act="dlg-cancel">' + ICON.close + '</button></div>' +
      '<div class="dlg-scroll"><div class="dlg-body"><div class="dlg-col">' +
      ro("פרויקט", "5003 מכבי חדרה - אאורה סיטי") + ro("לקוח", "281041", true) + ro("חוזה", "A/041", true) +
      inp("gd-no", "מספר ערבות", "no", 'style="direction:ltr;text-align:right"') +
      '<div class="fr"><label class="fl" for="gd-ass">מוסב</label><input id="gd-ass" type="checkbox" data-dlg="assigned"' + (d.assigned ? " checked" : "") + ' style="width:16px;height:16px;margin:0;accent-color:#0064d9"></div>' +
      ro("קבלה", "") +
      inp("gd-amt", "סכום", "amount", 'inputmode="decimal" style="direction:ltr;text-align:left"') +
      sel("gd-cur", "מטבע", "currency", CURRENCIES) + sel("gd-type", "סוג ערבות", "type", TYPES) + sel("gd-st", "סטטוס", "status", STATUSES) + sel("gd-idx", "מדד", "index", INDEXES) +
      inp("gd-bd", "בסיס", "baseDate", 'placeholder="mm/yyyy" style="direction:ltr;text-align:right"') +
      inp("gd-bv", "ערך", "baseValue", 'inputmode="decimal" style="direction:ltr;text-align:left"') +
      '<div class="fr" style="align-items:flex-start"><label class="fl" for="gd-notes" style="padding-top:4px">הערות</label><textarea id="gd-notes" class="fi" data-dlg="notes" style="height:58px;padding:4px 8px;resize:none">' + esc(d.notes) + '</textarea></div>' +
      '</div><div class="dlg-col"><h4 style="margin:0 0 2px;font-size:14px;font-weight:700;min-height:26px;display:flex;align-items:center">תאריכים</h4>' +
      dt("gd-d1", "תאריך התחלה", "start") + dt("gd-d2", "תאריך סיום", "end") + dt("gd-d3", "תאריך בקשה", "requested") + dt("gd-d4", "תאריך קבלה", "received") +
      dt("gd-d5", "תאריך החזרה", "returned") + dt("gd-d6", "תאריך הפקדה", "deposited") + dt("gd-d7", "תאריך החזרת הפקדה", "depositReturned") + dt("gd-d8", "תאריך ביטול", "cancelled") +
      '<div style="height:8px"></div>' +
      sel("gd-bank", "בנק", "bank", BANKS) + inp("gd-br", "סניף", "branch", 'inputmode="numeric"') + inp("gd-acc", "חשבון", "account", 'inputmode="numeric"') +
      inp("gd-fee", "אחוז עמלה שנתי", "fee", 'inputmode="decimal" style="direction:ltr;text-align:left"') + sel("gd-law", "עורך דין", "lawyer", LAWYERS) +
      inp("gd-fp", "אחוז עמלה", "feePct", 'inputmode="decimal" style="direction:ltr;text-align:left"') + inp("gd-fa", "סכום עמלה", "feeAmount", 'inputmode="decimal" style="direction:ltr;text-align:left"') +
      '</div></div>' +
      '<div style="padding:8px 24px 16px;display:flex;flex-direction:column;gap:6px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #0064d9;min-height:32px"><h4 style="margin:0;font-size:14px;font-weight:700;color:#0064d9">ערבים (' + d.guarantors.length + ')</h4>' +
      '<button type="button" class="btn" style="margin-bottom:3px" data-act="gu-add">' + ICON.plus + 'הוסף ערב</button></div>' +
      '<div class="table-box"><table class="gt"><thead><tr><th style="width:18%">שם</th><th style="width:12%">ת.ז.</th><th style="width:20%">כתובת</th><th style="width:9%">מספר בית</th><th style="width:12%">אזור</th><th style="width:9%">מיקוד</th><th>הערות</th><th style="width:44px"><span class="sr">פעולות</span></th></tr></thead><tbody>' + gu + '</tbody></table></div></div>' +
      '</div>' +
      '<div class="dlg-foot"><div style="display:flex;gap:8px"><button type="button" class="btn btn-lg btn-em" data-act="dlg-ok">אישור</button><button type="button" class="btn btn-lg" data-act="dlg-cancel">ביטול</button></div>' +
      '<div style="display:flex;gap:8px"><button type="button" class="btn btn-lg" data-act="dlg-new">חדש</button><button type="button" class="btn btn-lg">' + ICON.print + 'הפקת טופס</button></div></div>' +
      '</div></div>';
  }

  // ---------- render & events ----------
  var app = document.getElementById("app");
  function render() {
    var a = document.activeElement, fid = a && a.id;
    app.innerHTML = listCard() + detailsCard() + dialog();
    if (fid) { var el = document.getElementById(fid); if (el) el.focus(); }
  }
  function openDlg(at) { state.dlg = freshDlg(at); render(); var f = document.getElementById("gd-no"); if (f) f.focus(); }

  app.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]");
    if (t) {
      var act = t.getAttribute("data-act"), id = Number(t.getAttribute("data-id"));
      var idx = state.rows.findIndex(function (r) { return r.id === id; });
      switch (act) {
        case "append": openDlg(state.rows.length); return;
        case "insert": openDlg(idx + 1); return;
        case "remove":
          state.rows = state.rows.filter(function (r) { return r.id !== id; });
          if (state.selId === id) state.selId = state.rows[0] ? state.rows[0].id : null;
          break;
        case "dlg-cancel": state.dlg = null; break;
        case "dlg-new": state.dlg = freshDlg(state.dlg.at); break;
        case "gu-add": state.dlg.guarantors.push(newGu()); break;
        case "gu-remove": state.dlg.guarantors = state.dlg.guarantors.filter(function (g) { return g.id !== id; }); break;
        case "dlg-ok":
          var d = state.dlg, row = Object.assign({}, d, { amount: Number(String(d.amount).replace(/,/g, "")) || 0 });
          delete row.at;
          state.rows.splice(d.at, 0, row);
          state.selId = row.id; state.dlg = null; break;
        default: return;
      }
      render(); return;
    }
    if (ev.target.closest("select, input, label")) return;
    var r = ev.target.closest("[data-select]");
    if (r) { state.selId = Number(r.getAttribute("data-select")); render(); }
  });

  function onChange(ev) {
    var t = ev.target, val = t.type === "checkbox" ? t.checked : t.value;
    if (t.hasAttribute("data-row")) {
      var r = find(Number(t.getAttribute("data-row"))); if (r) r[t.getAttribute("data-k")] = val;
      if (ev.type === "change") render();
    } else if (t.hasAttribute("data-sel")) {
      var s = find(state.selId); if (s) s[t.getAttribute("data-sel")] = val;
    } else if (t.hasAttribute("data-dlg") && state.dlg) {
      state.dlg[t.getAttribute("data-dlg")] = val;
    } else if (t.hasAttribute("data-gu") && state.dlg) {
      var gid = Number(t.getAttribute("data-gu"));
      state.dlg.guarantors.forEach(function (g) { if (g.id === gid) g[t.getAttribute("data-k")] = val; });
    }
  }
  app.addEventListener("input", onChange);
  app.addEventListener("change", onChange);
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && state.dlg) { state.dlg = null; render(); } });

  render();
})();
</script>
</body>
</html>
